apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The Clerk auth starter — sign-in, sign-up and a protected dashboard (Next.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest and its sources declare.
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  # `app`, not `web`: a domain and a component share one name space in the
  # catalog, and a domain called `web` hid this component from it.
  domain: app
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  # No dependsOn: the site reads no wiring and binds nothing, so there is no
  # infra component to deploy before it.
  #
  # The Clerk application's two keys, stored per environment as the product's
  # secrets CLERK_PUBLISHABLE_KEY and CLERK_SECRET_KEY (README → Connect
  # Clerk). The publishable key is inlined by `next build`; the secret key is
  # read by the Worker at request time, so the build hands it to the Worker as
  # a Worker secret and no bundle contains it (buildCommand below). BEST-EFFORT
  # references, wire-now-seed-later: a key nobody has stored yet is skipped
  # when the job resolves its secrets (no env var, no failure), and a build
  # without both is the site with a "connect Clerk" notice where sign-in
  # would be — so a fresh product deploys and serves before its owner has a
  # Clerk application at all.
  optionalSecretEnv:
    NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "secret://clerk-auth-starter/clerk-auth-starter/{{ .environment }}/CLERK_PUBLISHABLE_KEY"
    CLERK_SECRET_KEY: "secret://clerk-auth-starter/clerk-auth-starter/{{ .environment }}/CLERK_SECRET_KEY"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: clerk-auth-starter-web-{dev,stage,prod}.
    workerName: clerk-auth-starter-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    # The site's public origin (the Open Graph image's absolute URL): the
    # environment's SITE_URL when intent.yaml sets one (a custom domain), else
    # its workers.dev URL. The subdomain is written out rather than read from
    # ${WORKERS_DEV_SUBDOMAIN}: the composition exports that to the smoke step
    # only, so the build would see it empty. ${ORUN_ENVIRONMENT} the runner
    # sets for every step.
    #
    # Clerk's secret key never reaches the build: `next build` is told only
    # that it exists (CLERK_SECRET_KEY_SET, next.config.ts) and runs without
    # it (`env -u`), so neither a bundle nor the bundler's cache holds it.
    # Then the key, when the environment has one, goes to the Worker as a
    # SECRET (tooling/wire/worker-secrets.mjs: `wrangler secret bulk`, the
    # value over stdin) before the composition deploys it. Only the deploy
    # lane holds a Cloudflare credential, so a verify lane builds the same and
    # pushes nothing.
    buildCommand: CLERK_SECRET_KEY_SET="${CLERK_SECRET_KEY:+true}" NEXT_PUBLIC_SITE_URL="${SITE_URL:-https://clerk-auth-starter-web-${ORUN_ENVIRONMENT}.your-workers-subdomain.workers.dev}" env -u CLERK_SECRET_KEY pnpm exec turbo run build --filter=@app/web && node ../../tooling/wire/worker-secrets.mjs --secret CLERK_SECRET_KEY --worker "clerk-auth-starter-web-${ORUN_ENVIRONMENT}" --config wrangler.jsonc

    # Smoke: the home page renders to its end (`</html>` — a render that
    # throws partway through a streamed page still sent a 200), whether or not
    # Clerk is connected; and /api/health answers ok — the Worker holds what
    # its build expects (Clerk's secret key when the build had Clerk's keys,
    # nothing when it did not). Each response is buffered before grep so an
    # early match cannot SIGPIPE curl.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q '</html>' && health=$(curl -sf \"${DEPLOYED_URL}/api/health\") && echo \"${health}\" | grep -q '\"ok\":true'"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
